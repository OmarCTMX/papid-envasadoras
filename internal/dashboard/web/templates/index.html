<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>{{.Titulo}}</title>
    <!-- ?v={{.Version}} invalida el caché del navegador en cada reinicio del
         servidor, para que las NUC no se queden con un CSS viejo. -->
    <link rel="stylesheet" href="/static/styles.css?v={{.Version}}">
    <!-- Las bolas se dibujan con CSS puro (sin ECharts/canvas): más ligero y
         fluido en pantallas sin GPU como las NUC. -->
</head>
<body>
    <!-- ============ HEADER: OF / item / lote ============ -->
    <header class="header">
        <div class="header-of">
            <span class="header-etiqueta">OF</span>
            <span class="header-of-num" id="of-num">—</span>
            <span class="header-item-name" id="item-name"></span>
        </div>
        <div class="header-lote">
            <span class="header-etiqueta">Lote</span>
            <span class="header-lote-valor">
                <span id="lote-actual">—</span><span class="sep">/</span><span id="lotes-totales">—</span>
            </span>
        </div>
    </header>

    <!-- ============ LAS TRES VALVULADORAS ============ -->
    <main class="envasadora" id="envasadora">
        <!-- Se generan por JS al cargar, una vez, y se actualizan por SSE. -->
    </main>

    <!-- ============ FOOTER: logo + conexión + reloj ============ -->
    <footer class="barra-estado" id="barra-estado">
        <!-- Izquierda: logo + punto de estado + nombre de la máquina.
             El nombre toma el color del estado (verde en vivo / rojo offline). -->
        <div class="footer-izq">
            <img class="logoPegaduro" src="/static/LogoPegaduro.png" alt="Pegaduro">
            <span class="estado-conexion offline" id="estado-conexion">
                <span class="estado-punto"></span>
                <span class="estado-maquina" id="estado-maquina">{{.Maquina}}</span>
            </span>
        </div>

        <!-- Centro: personal de la orden (llega en el POST /api/orden). -->
        <span class="footer-trabajadores" id="footer-trabajadores">—</span>

        <!-- Derecha: reloj -->
        <span class="estado-reloj" id="estado-reloj">--:--:--</span>
    </footer>

    <script>
    // ============================================================
    //  Configuración inyectada por el servidor.
    // ============================================================
    const NUM_VALVULADORAS = {{.NumEnvasadoras}};
    // Código identificador de cada bola (del .env, CODIGOS_ENVASADORAS). Solo
    // informativo: se muestra junto a los bultos. Puede venir vacío por bola.
    const CODIGOS_VALVULADORAS = [{{range $i, $c := .Codigos}}{{if $i}},{{end}}"{{$c}}"{{end}}];

    // ============================================================
    //  Construcción de las tres tarjetas (una sola vez).
    //  Layout de cada tarjeta (sin título, la bola pegada arriba):
    //    bola (liquidFill)  →  contador de bultos  →
    //    [ LEDs vertical + setpoint/columna ] [ tabla ID / Peso / Fecha ]
    //  El 100% de llenado de la bola es el PESO_PRODUCTO de la orden; el número
    //  que se ve es el PESO directo (en kg).
    // ============================================================
    const contenedor = document.getElementById('envasadora');

    // Fila de un LED (botón + etiqueta a la derecha). El id va en .led-item,
    // que es el que recibe la clase .on.
    function filaLed(id, color, etiqueta) {
        return '<div class="led-item" id="' + id + '">' +
                   '<span class="led led-' + color + '"><span class="led-bulb"></span></span>' +
                   '<span class="led-label">' + etiqueta + '</span>' +
               '</div>';
    }

    function crearValvuladora(indice) {
        const card = document.createElement('section');
        card.className = 'valvuladora';
        card.innerHTML =
            // Bola con CSS puro (sin ECharts): un círculo con una capa de agua
            // cuya altura es el % de llenado. La transición CSS da el movimiento
            // suave sin repintar un canvas (clave en la NUC sin GPU).
            '<div class="bola">' +
                '<div class="bola-circulo" id="bola-' + indice + '">' +
                    '<div class="bola-agua" id="agua-' + indice + '"></div>' +
                    '<div class="bola-texto">' +
                        '<span class="bola-peso" id="peso-' + indice + '">0.0</span>' +
                        '<span class="bola-unidad">kg</span>' +
                    '</div>' +
                '</div>' +
            '</div>' +
            // Contador de bultos. Tres zonas: código (izquierda), "Bultos + número"
            // (centro, centrado por defecto) y un hueco invisible (derecha) del
            // mismo peso que el código. Si el código es largo, el centro se
            // recorre a la derecha en vez de encimarse. El código se escribe con
            // textContent más abajo (no innerHTML).
            '<div class="contador">' +
                '<span class="contador-codigo" title="Identificador de la envasadora"></span>' +
                '<div class="contador-centro">' +
                    '<span class="contador-etiqueta">Bultos</span>' +
                    '<span class="contador-num" id="bultos-' + indice + '">0</span>' +
                '</div>' +
                '<span class="contador-spacer"></span>' +
            '</div>' +
            '<div class="inferior">' +
                // Izquierda: LEDs en vertical (solo visuales, del PLC) + valores.
                '<div class="panel-estado">' +
                    filaLed('led-ciclo-' + indice, 'verde', 'Ciclo') +
                    filaLed('led-limpieza-' + indice, 'amarillo', 'Limpieza') +
                    filaLed('led-paro-' + indice, 'rojo', 'Paro') +
                    '<div class="dato">' +
                        '<span class="dato-num"><span id="setpoint-' + indice + '">—</span><span class="unidad">kg</span></span>' +
                        '<span class="dato-etiqueta">Setpoint</span>' +
                    '</div>' +
                    '<div class="dato">' +
                        '<span class="dato-num"><span id="columna-' + indice + '">—</span><span class="unidad">kg</span></span>' +
                        '<span class="dato-etiqueta">Columna</span>' +
                    '</div>' +
                '</div>' +
                // Derecha: últimos bultos envasados.
                '<div class="panel-tabla">' +
                    '<table class="tabla-bultos">' +
                        '<colgroup><col class="c-id"><col class="c-peso"><col class="c-fecha"></colgroup>' +
                        '<thead><tr><th>ID</th><th>Peso</th><th>Fecha</th></tr></thead>' +
                        '<tbody id="tabla-' + indice + '"></tbody>' +
                    '</table>' +
                '</div>' +
            '</div>';
        contenedor.appendChild(card);

        // El código va con textContent (no innerHTML) para no inyectar HTML.
        const codigo = CODIGOS_VALVULADORAS[indice];
        if (codigo) {
            const pill = card.querySelector('.contador-codigo');
            if (pill) pill.textContent = codigo;
        }

        pintarTabla(indice, []);
    }

    // dibujarBola actualiza la bola i con CSS: la altura del agua = % de
    // llenado (peso/tope, acotado 0..1) y el texto = peso real con 1 decimal.
    // La transición suave la hace el CSS (height), no JS por frame: barato en
    // una NUC sin GPU. Si el tope es 0 (sin orden), la bola queda vacía.
    function dibujarBola(i, peso, tope) {
        const fraccion = tope > 0 ? Math.max(0, Math.min(1, peso / tope)) : 0;
        const agua = document.getElementById('agua-' + i);
        const txt = document.getElementById('peso-' + i);
        if (agua) agua.style.height = (fraccion * 100).toFixed(1) + '%';
        if (txt) txt.textContent = peso.toFixed(1);
    }

    for (let i = 0; i < NUM_VALVULADORAS; i++) {
        crearValvuladora(i);
    }

    // ============================================================
    //  Aplicar un estado completo a la UI (header + bolas + valores).
    // ============================================================
    const fmt = function (n) {
        if (n === null || n === undefined || n === '') return '—';
        return n;
    };

    function aplicarEstado(estado) {
        // --- Header ---
        document.getElementById('of-num').textContent = fmt(estado.of);
        document.getElementById('item-name').textContent = estado.item_name || '';
        // Lote: lotes COMPLETADOS / totales (sin orden: "—").
        const hayOrden = !!estado.of;
        document.getElementById('lote-actual').textContent = hayOrden ? fmt(estado.lote_actual) : '—';
        document.getElementById('lotes-totales').textContent = hayOrden ? fmt(estado.lotes_totales) : '—';
        document.querySelector('.header-lote').classList.toggle('terminada', !!estado.orden_terminada);

        // Footer: personal de la orden (viene en el POST): "Nombre (Rol) · ...".
        pintarTrabajadores(estado.trabajadores || []);

        // --- Valvuladoras ---
        const vals = estado.valvuladoras || [];
        for (let i = 0; i < NUM_VALVULADORAS; i++) {
            const v = vals[i] || { peso: 0, setpoint: null, columna: null };
            // El llenado usa el peso_producto de la orden como 100% (igual para
            // las 3 bolas). El setpoint solo se muestra abajo.
            dibujarBola(i, v.peso || 0, estado.peso_producto || 0);
            document.getElementById('setpoint-' + i).textContent = fmt(v.setpoint);
            document.getElementById('columna-' + i).textContent = fmt(v.columna);

            // Contador de bultos de la orden y tabla de los últimos bultos.
            document.getElementById('bultos-' + i).textContent = v.bultos || 0;
            pintarTabla(i, v.registros || []);

            // LEDs: on/off del PLC. Se leen de la valvuladora (v.leds) y, si no
            // vienen ahí, del nivel de la envasadora (estado.leds), para que
            // sirva tanto si son por valvuladora como si son de la máquina.
            const leds = v.leds || estado.leds || {};
            marcarLed('led-paro-' + i, leds.paro);
            marcarLed('led-limpieza-' + i, leds.limpieza);
            marcarLed('led-ciclo-' + i, leds.ciclo);
        }
    }

    // pintarTrabajadores arma el footer con textContent (nunca innerHTML con
    // datos externos): "Omar Ramirez (Envasador) · Michel Davalos (Envasador)".
    function pintarTrabajadores(lista) {
        const el = document.getElementById('footer-trabajadores');
        const frag = document.createDocumentFragment();
        lista.forEach(function (t, i) {
            if (i > 0) frag.appendChild(document.createTextNode('  ·  '));
            frag.appendChild(document.createTextNode(t.nombre || ''));
            if (t.rol) {
                const rol = document.createElement('span');
                rol.className = 'footer-rol';
                rol.textContent = ' (' + t.rol + ')';
                frag.appendChild(rol);
            }
        });
        if (!lista.length) frag.appendChild(document.createTextNode('—'));
        el.replaceChildren(frag);
    }

    // marcarLed enciende/apaga un LED por su id agregando/quitando la clase .on
    function marcarLed(id, encendido) {
        const el = document.getElementById(id);
        if (el) el.classList.toggle('on', !!encendido);
    }

    // ============================================================
    //  Tabla de bultos (ID / Peso / Fecha), del más nuevo al más viejo.
    //  Se arma con textContent (nunca innerHTML con datos externos). Las filas
    //  que no caben quedan ocultas por el overflow del panel.
    // ============================================================
    function dosDigitos(n) { return (n < 10 ? '0' : '') + n; }

    // "2026-09-30T11:27:32-06:00" -> día "30/09" + hora "11:27:32".
    // Si la fecha no se puede interpretar, se muestra tal cual llegó.
    function partirFecha(texto) {
        const d = new Date(texto);
        if (!texto || isNaN(d.getTime())) return { dia: '', hora: texto || '—' };
        return {
            dia: dosDigitos(d.getDate()) + '/' + dosDigitos(d.getMonth() + 1),
            hora: dosDigitos(d.getHours()) + ':' + dosDigitos(d.getMinutes()) + ':' + dosDigitos(d.getSeconds())
        };
    }

    function celda(tr, texto, extraClase, extraTexto) {
        const td = document.createElement('td');
        if (extraClase) {
            const s = document.createElement('span');
            s.className = extraClase;
            s.textContent = extraTexto;
            // La fecha lleva el día atenuado antes de la hora; el peso lleva la
            // unidad atenuada después del número.
            if (extraClase === 'fecha-dia') { td.appendChild(s); td.appendChild(document.createTextNode(texto)); }
            else { td.appendChild(document.createTextNode(texto)); td.appendChild(s); }
        } else {
            td.textContent = texto;
        }
        tr.appendChild(td);
    }

    function pintarTabla(i, registros) {
        const tbody = document.getElementById('tabla-' + i);
        if (!tbody) return;
        const filas = document.createDocumentFragment();
        if (!registros.length) {
            const tr = document.createElement('tr');
            const td = document.createElement('td');
            td.colSpan = 3;
            td.className = 'vacio';
            td.textContent = 'Sin bultos registrados';
            tr.appendChild(td);
            filas.appendChild(tr);
        }
        registros.forEach(function (r) {
            const tr = document.createElement('tr');
            const peso = (typeof r.peso === 'number') ? r.peso.toFixed(2) : String(r.peso == null ? '—' : r.peso);
            const f = partirFecha(r.fecha);
            celda(tr, String(r.id == null || r.id === '' ? '—' : r.id));
            celda(tr, peso, 'unidad', 'kg');
            celda(tr, f.hora, f.dia ? 'fecha-dia' : '', f.dia);
            filas.appendChild(tr);
        });
        tbody.replaceChildren(filas);
    }

    // ============================================================
    //  SSE: el servidor empuja el estado como JSON en el evento "estado".
    // ============================================================
    const evtSource = new EventSource('/events');

    evtSource.addEventListener('estado', function (e) {
        try {
            aplicarEstado(JSON.parse(e.data));
        } catch (err) {
            console.error('[SSE] estado inválido:', err);
        }
    });

    // ============================================================
    //  Footer: reloj + indicador de conexión en vivo/offline.
    // ============================================================
    const elReloj = document.getElementById('estado-reloj');
    const elConexion = document.getElementById('estado-conexion');

    // Hay DOS conexiones que vigilar, y las dos se detectan en vivo:
    //   sseVivo  = navegador ↔ dashboard (el stream SSE). Si se cae, el
    //              dashboard es inalcanzable → "Offline".
    //   natsVivo = dashboard ↔ NATS (lo avisa el servidor por el evento 'nats').
    //              Si se cae, el dashboard sigue pero NO llegan datos del
    //              PLC/emitter → "Sin datos".
    // "En vivo" solo cuando AMBAS están bien.
    let sseVivo = false;
    let natsVivo = false;

    function pintarEstado() {
        const ok = sseVivo && natsVivo;
        elConexion.classList.toggle('online', ok);
        elConexion.classList.toggle('offline', !ok);
        // title = texto al pasar el mouse, para distinguir el motivo sin saturar
        // el footer (que muestra el nombre de la máquina).
        if (!sseVivo) elConexion.title = 'Offline: sin conexión con el dashboard';
        else if (!natsVivo) elConexion.title = 'Sin datos: el dashboard no tiene NATS (no llega el PLC)';
        else elConexion.title = 'En vivo';
    }

    function tick() {
        elReloj.textContent = new Date().toLocaleTimeString('es-MX', { hour12: false });
    }
    tick();
    setInterval(tick, 1000);

    evtSource.onopen = function () {
        console.log('%c[SSE] Conexión abierta', 'color: green; font-weight: bold');
        sseVivo = true;
        pintarEstado();
    };
    evtSource.onerror = function () {
        // readyState 0 = reconectando, 2 = cerrada. En ambos no hay stream vivo.
        sseVivo = false;
        pintarEstado();
    };

    // El servidor avisa el estado de NATS: {"conectado": true/false}.
    evtSource.addEventListener('nats', function (e) {
        try {
            natsVivo = !!JSON.parse(e.data).conectado;
        } catch (err) {
            natsVivo = false;
        }
        pintarEstado();
    });
    </script>
</body>
</html>
