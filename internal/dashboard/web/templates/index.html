<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>{{.Titulo}}</title>
    <!-- ?v={{.Version}} invalida el caché del navegador en cada reinicio del
         servidor, para que las NUC no se queden con un CSS viejo. -->
    <link rel="stylesheet" href="/static/styles.css?v={{.Version}}">
    <!-- Las bolas se dibujan con CSS puro (sin ECharts/canvas): más ligero y
         fluido en pantallas sin GPU como las NUC. -->
</head>
<body>
    <!-- ============ CARRUSEL: 5 pantallas que rotan solas ============
         1) Principal: logo, hora y nombre de la máquina.
         2) Personal: tarjetas de login/logout en vivo (emitter por NATS).
         3) Orden: nombre, número de orden y lote / total.
         4) Silos: las bolas (2 o 3, según el YAML) con LEDs, setpoint, tara y
            columna.
         5) Bultos: total de la orden y bultos por envasadora.
         BLOQUEO: mientras no haya orden o falte alguien por registrarse, solo
         rotan la 1 y la 2. Todo grande para leerse de lejos. -->
    <main class="carrusel" id="carrusel">
        <!-- ---------- Pantalla 1: PRINCIPAL (logo + hora + máquina) ----------
             data-siempre="1": se muestra aunque el carrusel esté BLOQUEADO. -->
        <section class="slide slide-principal activa" data-siempre="1" aria-label="Principal">
            <!-- Izquierda: logo grande, centrado. -->
            <div class="principal-izq">
                <img class="principal-logo" src="/static/logoOscuro.png" alt="Pegaduro">
            </div>
            <!-- Derecha: hora arriba, nombre de la máquina abajo. -->
            <div class="principal-der">
                <span class="principal-reloj" id="principal-reloj">--:--:--</span>
                <span class="principal-maquina">{{.Maquina}}</span>
            </div>
        </section>

        <!-- ---------- Pantalla 2: PERSONAL (login / logout en vivo) ----------
             Mismo diseño y transiciones que el Dashboard Personal, pero en
             horizontal y grande. Cada rectángulo es una "pista"; la tarjeta
             crece a lo ANCHO según el estado:
               gris (vacante)   -> solo el toro + "Vacante"
               naranja (pending)-> crece y muestra nombre + rol
               verde (active)   -> ocupa todo el rectángulo -->
        <section class="slide slide-personal" data-solo-bloqueo="1" aria-label="Personal">
            <div class="personal-slots" id="personal-slots">
                <!-- Se generan por JS (SLOTS_PERSONAL) y se actualizan por SSE. -->
            </div>
        </section>

        <!-- ---------- Pantalla 3: ORDEN ---------- -->
        <!-- Un solo rectángulo: el número de orden grande y, debajo, el nombre
             de la orden. El número ocupa TODO el ancho posible. -->
        <section class="slide slide-orden" aria-label="Orden">
            <div class="orden-caja" id="orden-caja">
                <span class="orden-of" id="of-num">—</span>
                <span class="orden-etiqueta" id="item-name">—</span>
                <span class="orden-lote">
                    <span class="orden-lote-valor">
                        <span id="bultos-llevan">—</span><span class="sep">/</span><span id="bultos-esperados">—</span>
                    </span>
                    <span class="orden-etiqueta">Bultos</span>
                </span>
            </div>
        </section>

        <!-- ---------- Pantalla 4: SILOS ---------- -->
        <!-- PAUSADA: data-pausada="1" hace que el carrusel la salte (no se ve
             ni cuenta). Quita el atributo para volver a mostrarla. -->
        <section class="slide slide-silos" data-pausada="1" aria-label="Envasadoras">
            <div class="silos" id="silos">
                <!-- Se generan por JS al cargar, una vez, y se actualizan por SSE. -->
            </div>
        </section>

        <!-- ---------- Pantalla 5: BULTOS por envasadora ---------- -->
        <!-- Una sola card: título "ENVASADORAS" grande arriba y los contadores
             de cada envasadora abajo. El total de bultos ya se ve en la
             pantalla de la orden. -->
        <section class="slide slide-bultos" aria-label="Bultos">
            <div class="bultos-card">
                <div class="bultos-envases" id="bultos-envases">
                    <!-- Una celda por envasadora (JS). -->
                </div>
            </div>
        </section>

        <!-- Indicador discreto de qué pantalla se ve (un punto por pantalla,
             los genera el JS). Bloqueado: los puntos de las pantallas que no
             rotan se atenúan. -->
        <div class="carrusel-puntos" id="carrusel-puntos" aria-hidden="true"></div>
    </main>

    <script>
    // ============================================================
    //  Configuración inyectada por el servidor (config.yaml).
    // ============================================================
    const NUM_VALVULADORAS = {{.NumEnvasadoras}};
    // Código identificador de cada bola. Puede venir vacío por bola.
    const CODIGOS_VALVULADORAS = [{{range $i, $c := .Codigos}}{{if $i}},{{end}}"{{$c}}"{{end}}];
    // Por bola: qué datos opcionales tienen topic en el YAML. Sin topic se
    // muestra "—" (un 0 haría creer que el PLC manda 0).
    const OPCIONALES = [{{range $i, $o := .Opcionales}}{{if $i}},{{end}}{ setpoint: {{$o.Setpoint}}, tara: {{$o.Tara}}, columna: {{$o.Columna}} }{{end}}];
    // Duración de cada pantalla del carrusel (ms).
    const CAROUSEL_MS = Math.max(3, {{.CarouselSegundos}}) * 1000;
    // Rectángulos de la pantalla de personal (1..3, del YAML).
    const SLOTS_PERSONAL = {{.SlotsPersonal}};

    // ============================================================
    //  Carrusel. Solo cambia clases (opacidad): barato en la NUC.
    //
    //  BLOQUEO (reemplaza el cambio de pantalla de Node-RED): las pantallas
    //  de producción (orden, silos, bultos) solo rotan cuando HAY ORDEN y
    //  TODO el personal asignado está registrado (verde). Si no, solo rotan
    //  las pantallas con data-siempre="1" (principal y personal).
    //  Cuando alguien hace login/logout, se salta a la pantalla de personal
    //  para que se vea la transición de su tarjeta.
    // ============================================================
    const slides = Array.prototype.slice.call(document.querySelectorAll('.slide'));
    const slidePersonal = document.querySelector('.slide-personal');
    const contPuntos = document.getElementById('carrusel-puntos');
    const puntos = slides.map(function () {
        const p = document.createElement('span');
        p.className = 'punto';
        contPuntos.appendChild(p);
        return p;
    });
    let slideActual = 0;
    let bloqueado = true;   // hasta saber que hay orden + todos registrados
    let timerCarrusel = null;

    function permitidas() {
        // Las pausadas (data-pausada="1") nunca entran en la rotación.
        const base = slides.filter(function (s) { return s.dataset.pausada !== '1'; });
        if (bloqueado) {
            // Bloqueado (sin orden o alguien sin registrar): solo las de
            // "siempre" (hora) y las de "solo-bloqueo" (personal).
            return base.filter(function (s) {
                return s.dataset.siempre === '1' || s.dataset.soloBloqueo === '1';
            });
        }
        // Desbloqueado (produciendo): todo MENOS las de "solo-bloqueo"
        // (la de personal, que solo tiene sentido mientras falta algo).
        return base.filter(function (s) { return s.dataset.soloBloqueo !== '1'; });
    }

    function mostrarSlide(n) {
        slideActual = n;
        slides.forEach(function (s, i) { s.classList.toggle('activa', i === slideActual); });
        const perm = permitidas();
        puntos.forEach(function (p, i) {
            p.classList.toggle('activo', i === slideActual);
            p.classList.toggle('bloqueado', perm.indexOf(slides[i]) < 0);
        });
        // Reinicia el tiempo: la pantalla recién mostrada dura un ciclo
        // completo aunque se haya llegado por un salto (login/logout).
        clearTimeout(timerCarrusel);
        timerCarrusel = setTimeout(siguienteSlide, CAROUSEL_MS);
        if (slides[slideActual] === slidePersonal) checkMarquee();
    }

    function siguienteSlide() {
        const perm = permitidas();
        // Si la pantalla actual ya no está permitida (indexOf = -1), va a la
        // primera permitida.
        const idx = perm.indexOf(slides[slideActual]);
        mostrarSlide(slides.indexOf(perm[(idx + 1) % perm.length]));
    }

    // Recalcula el bloqueo con la orden y el personal actuales.
    let hayOrdenActual = false;
    let slotsActuales = [];
    // Cuánto se queda en la pantalla de personal, tras desbloquear, para que
    // se vea la animación de las tarjetas poniéndose verdes, antes de ocultarla.
    const DELAY_OCULTAR_PERSONAL_MS = 1500;
    let timerDesbloqueo = null;

    function actualizarBloqueo() {
        const asignados = slotsActuales.filter(function (t) { return t.estado !== 'empty'; });
        const todosRegistrados = asignados.length > 0 &&
            asignados.every(function (t) { return t.estado === 'active'; });
        const nuevo = !(hayOrdenActual && todosRegistrados);
        if (nuevo === bloqueado) return;

        if (nuevo) {
            // --- Se BLOQUEA (quitaron orden o personal) ---
            clearTimeout(timerDesbloqueo);
            timerDesbloqueo = null;
            bloqueado = true;
            // Si se estaba viendo una pantalla de producción (ya no permitida),
            // se salta a la de personal de inmediato.
            if (permitidas().indexOf(slides[slideActual]) < 0) {
                mostrarSlide(slides.indexOf(slidePersonal));
            } else {
                mostrarSlide(slideActual);
            }
            return;
        }

        // --- Se DESBLOQUEA (orden + todos verdes) ---
        // Nos quedamos en la pantalla de personal un momento para que se vea
        // la animación de login; recién después quitamos esa pantalla de la
        // rotación. Mientras tanto seguimos "bloqueados" para no saltar aún.
        mostrarSlide(slides.indexOf(slidePersonal));
        clearTimeout(timerDesbloqueo);
        timerDesbloqueo = setTimeout(function () {
            timerDesbloqueo = null;
            bloqueado = false;
            // Avanza a la primera pantalla de producción (ya sin personal).
            siguienteSlide();
        }, DELAY_OCULTAR_PERSONAL_MS);
    }

    // ============================================================
    //  Construcción (una sola vez) de las bolas y de las celdas de bultos.
    // ============================================================
    const contSilos = document.getElementById('silos');
    const contBultos = document.getElementById('bultos-envases');
    // Para que el CSS ajuste tamaños según 2 o 3 silos.
    contSilos.style.setProperty('--n', NUM_VALVULADORAS);
    contBultos.style.setProperty('--n', NUM_VALVULADORAS);

    // LED grande + etiqueta debajo. El id va en .led-item (recibe la clase .on).
    function filaLed(id, color, etiqueta) {
        return '<div class="led-item" id="' + id + '">' +
                   '<span class="led led-' + color + '"><span class="led-bulb"></span></span>' +
                   '<span class="led-label">' + etiqueta + '</span>' +
               '</div>';
    }

    // Caja de dato grande: número + unidad, etiqueta abajo. La unidad se pasa
    // por parámetro (setpoint/tara en kg; columna en g).
    function cajaDato(id, etiqueta, unidad) {
        return '<div class="dato">' +
                   '<span class="dato-num"><span id="' + id + '">—</span><span class="unidad">' + unidad + '</span></span>' +
                   '<span class="dato-etiqueta">' + etiqueta + '</span>' +
               '</div>';
    }

    function crearSilo(i) {
        const card = document.createElement('section');
        card.className = 'silo';
        card.innerHTML =
            '<div class="silo-codigo"></div>' +
            // Bola con CSS puro: la altura del agua es el % de llenado.
            '<div class="bola">' +
                '<div class="bola-circulo" id="bola-' + i + '">' +
                    '<div class="bola-agua" id="agua-' + i + '"></div>' +
                    '<div class="bola-texto">' +
                        '<span class="bola-peso" id="peso-' + i + '">0.0</span>' +
                        '<span class="bola-unidad">kg</span>' +
                    '</div>' +
                '</div>' +
            '</div>' +
            '<div class="silo-leds">' +
                filaLed('led-ciclo-' + i, 'verde', 'Ciclo') +
                filaLed('led-limpieza-' + i, 'amarillo', 'Limpieza') +
                filaLed('led-paro-' + i, 'rojo', 'Paro') +
            '</div>' +
            '<div class="silo-datos">' +
                cajaDato('setpoint-' + i, 'Setpoint', 'kg') +
                cajaDato('tara-' + i, 'Tara', 'kg') +
                cajaDato('columna-' + i, 'Columna', 'g') +
            '</div>';
        contSilos.appendChild(card);
        // El código va con textContent (no innerHTML) para no inyectar HTML.
        card.querySelector('.silo-codigo').textContent = CODIGOS_VALVULADORAS[i] || ('Envasadora ' + (i + 1));
    }

    function crearCeldaBultos(i) {
        const celda = document.createElement('div');
        celda.className = 'envase';
        celda.innerHTML =
            '<span class="envase-codigo"></span>' +
            '<span class="envase-num" id="bultos-' + i + '">0</span>' +
            '<span class="envase-etiqueta">bultos</span>';
        contBultos.appendChild(celda);
        celda.querySelector('.envase-codigo').textContent = CODIGOS_VALVULADORAS[i] || ('Envasadora ' + (i + 1));
    }

    for (let i = 0; i < NUM_VALVULADORAS; i++) {
        crearSilo(i);
        crearCeldaBultos(i);
    }

    // ============================================================
    //  Pantalla de personal: una tarjeta por rectángulo (horizontal).
    //  Anatomía (como dashboardGo, pero acostada):
    //    .slot-avatar -> toro + estado   (ancla, SIEMPRE visible)
    //    .slot-info   -> nombre + rol    (aparece en naranja y verde)
    //  Se crean UNA vez y se actualizan cambiando la clase de estado, para que
    //  las transiciones CSS se disparen igual que en dashboardGo.
    // ============================================================
    const STATUS_LABELS = { empty: 'Vacante', pending: 'Sin registrar', active: 'En linea' };
    const contPersonal = document.getElementById('personal-slots');
    // Para que el CSS reparta el alto entre 1, 2 o 3 rectángulos.
    contPersonal.style.setProperty('--n', SLOTS_PERSONAL);

    for (let i = 0; i < SLOTS_PERSONAL; i++) {
        const pista = document.createElement('div');
        pista.className = 'slot-pista';
        pista.innerHTML =
            '<div class="slot-card empty" id="slot-' + i + '">' +
                '<div class="slot-avatar">' +
                    '<div class="slot-icon"><img class="slot-foto" src="/static/toro.png" alt=""></div>' +
                    '<span class="slot-status">Vacante</span>' +
                '</div>' +
                '<div class="slot-info">' +
                    '<div class="slot-name-wrap"><p class="slot-name">No asignado</p></div>' +
                    '<p class="slot-role">—</p>' +
                '</div>' +
            '</div>';
        contPersonal.appendChild(pista);
    }

    // pintarPersonal actualiza las tarjetas IN-PLACE (con textContent). Si
    // algún estado cambió (login/logout/asignación), salta a la pantalla de
    // personal para que se vea la transición.
    let primeraVezPersonal = true;
    function pintarPersonal(lista) {
        let huboCambio = false;
        for (let i = 0; i < SLOTS_PERSONAL; i++) {
            const t = lista[i] || { nombre: 'No asignado', rol: '—', estado: 'empty' };
            const card = document.getElementById('slot-' + i);
            if (!card) continue;
            const clase = 'slot-card ' + t.estado;
            if (card.className !== clase) huboCambio = true;
            card.className = clase;
            card.querySelector('.slot-name').textContent = t.nombre;
            card.querySelector('.slot-role').textContent = t.rol;
            card.querySelector('.slot-status').textContent = STATUS_LABELS[t.estado] || 'Vacante';
        }
        slotsActuales = lista.slice(0, SLOTS_PERSONAL);
        checkMarquee();
        if (huboCambio && !primeraVezPersonal) {
            mostrarSlide(slides.indexOf(slidePersonal));
        }
        primeraVezPersonal = false;
        actualizarBloqueo();
    }

    // ============================================================
    //  Marquee (igual que dashboardGo): si el nombre no cabe, se desplaza
    //  como letrero de luces. Se mide solo con la tarjeta abierta.
    // ============================================================
    function checkMarquee() {
        document.querySelectorAll('.slot-name').forEach(function (el) {
            const wrap = el.closest('.slot-name-wrap');
            if (!wrap) return;
            const card = el.closest('.slot-card');
            if (card && card.classList.contains('empty')) { el.classList.remove('marquee'); return; }

            el.classList.remove('marquee');
            el.style.transform = 'none';
            el.style.removeProperty('--marquee-offset');
            el.style.removeProperty('--marquee-dur');

            const textWidth = el.scrollWidth;
            const wrapWidth = wrap.clientWidth;
            // wrapWidth 0 = la pantalla no está visible o la tarjeta aún se
            // está abriendo; se vuelve a medir al terminar la transición.
            if (wrapWidth > 0 && textWidth > wrapWidth + 2) {
                const offset = -(textWidth - wrapWidth + 16);
                const dur = Math.max(8, Math.min(24, (textWidth - wrapWidth) / 30));
                el.style.setProperty('--marquee-offset', offset + 'px');
                el.style.setProperty('--marquee-dur', dur.toFixed(1) + 's');
                el.style.transform = '';
                el.classList.add('marquee');
            } else {
                el.style.transform = '';
            }
        });
    }
    // Al terminar de abrirse/cerrarse una tarjeta ya se puede medir el nombre.
    contPersonal.addEventListener('transitionend', function (e) {
        if (e.target.classList && (e.target.classList.contains('slot-card') ||
                                   e.target.classList.contains('slot-info'))) {
            checkMarquee();
        }
    });
    window.addEventListener('resize', checkMarquee);

    // dibujarBola: altura del agua = % de llenado (peso/tope, acotado 0..1) y
    // ============================================================
    //  ajustarTexto: encoge la fuente de un elemento SOLO si su contenido se
    //  desborda del contenedor (ancho o alto). Es el "fit text" que CSS no
    //  puede hacer solo (CSS no sabe medir el texto). El tamaño grande lo pone
    //  el CSS; aquí solo se REDUCE cuando un número tiene demasiados dígitos.
    //
    //  Cómo: se borra el font-size en línea para volver al del CSS, se mide el
    //  desbordamiento y se baja la fuente por un factor hasta que quepa (con un
    //  mínimo para no desaparecer). Barato: un puñado de iteraciones y solo
    //  cuando cambia el número.
    // ============================================================
    function ajustarTexto(el, contenedor, soloAncho) {
        if (!el) return;
        // Contenedor contra el que se mide el desbordamiento. Por defecto el
        // padre; se puede pasar otro (ej. el círculo de la bola, porque el
        // .bola-texto se encoge al contenido y nunca "desbordaría").
        const cont = contenedor || el.parentElement;
        if (!cont) return;
        el.style.fontSize = '';            // vuelve al tamaño del CSS
        // px actuales del CSS (base desde la que se encoge).
        let px = parseFloat(getComputedStyle(el).fontSize);
        const minPx = 12;                  // nunca más chico que esto
        let guard = 40;                    // tope de iteraciones por seguridad
        // ¿Se sale? Ancho siempre; alto solo si no se pidió soloAncho (en la
        // card de la orden el número comparte alto con el nombre y el lote).
        const desborda = function () {
            if (el.scrollWidth > cont.clientWidth) return true;
            return !soloAncho && el.scrollHeight > cont.clientHeight;
        };
        while (guard-- > 0 && px > minPx && desborda()) {
            px *= 0.92;                    // baja ~8% y vuelve a medir
            el.style.fontSize = px + 'px';
        }
    }

    // texto = peso real con 1 decimal (sin tope). Sin tope (sin orden) la bola
    // queda vacía.
    function dibujarBola(i, peso, tope) {
        const fraccion = tope > 0 ? Math.max(0, Math.min(1, peso / tope)) : 0;
        const agua = document.getElementById('agua-' + i);
        const txt = document.getElementById('peso-' + i);
        if (agua) agua.style.height = (fraccion * 100).toFixed(1) + '%';
        if (txt) {
            txt.textContent = peso.toFixed(1);
            // Se mide contra el círculo (el .bola-texto se ajusta al contenido).
            ajustarTexto(txt, document.getElementById('bola-' + i));
        }
    }

    // ============================================================
    //  Aplicar un estado completo a las 3 pantallas.
    // ============================================================
    const fmt = function (n) {
        if (n === null || n === undefined || n === '') return '—';
        return n;
    };

    // Dato opcional: "—" si la bola no tiene topic para ese dato.
    function datoOpcional(id, configurado, valor) {
        const el = document.getElementById(id);
        if (!el) return;
        el.textContent = (configurado && typeof valor === 'number') ? valor.toFixed(1) : '—';
    }

    function aplicarEstado(estado) {
        // --- Pantalla 1: orden ---
        const hayOrden = !!estado.of;
        const elOf = document.getElementById('of-num');
        elOf.textContent = fmt(estado.of);
        ajustarTexto(elOf, document.getElementById('orden-caja'), true);
        // Nombre de la orden, debajo del número (estilo de etiqueta gris).
        document.getElementById('item-name').textContent = hayOrden ? (estado.item_name || '—') : '—';
        // Bultos que llevan / bultos esperados (cantidadBts * noLotes).
        document.getElementById('bultos-llevan').textContent = hayOrden ? (estado.bultos_orden || 0) : '—';
        document.getElementById('bultos-esperados').textContent = hayOrden ? (estado.bultos_esperados || 0) : '—';
        document.getElementById('orden-caja').classList.toggle('terminada', !!estado.orden_terminada);

        // --- Pantalla 2 (silos) y 3 (bultos por envase) ---
        const vals = estado.valvuladoras || [];
        for (let i = 0; i < NUM_VALVULADORAS; i++) {
            const v = vals[i] || {};
            const op = OPCIONALES[i] || {};
            // El 100% de llenado es el peso_producto de la orden.
            dibujarBola(i, v.peso || 0, estado.peso_producto || 0);
            datoOpcional('setpoint-' + i, op.setpoint, v.setpoint);
            datoOpcional('tara-' + i, op.tara, v.tara);
            datoOpcional('columna-' + i, op.columna, v.columna);

            // LEDs: de la valvuladora o, si no vienen, de la máquina.
            const leds = v.leds || estado.leds || {};
            marcarLed('led-paro-' + i, leds.paro);
            marcarLed('led-limpieza-' + i, leds.limpieza);
            marcarLed('led-ciclo-' + i, leds.ciclo);

            const elBultos = document.getElementById('bultos-' + i);
            elBultos.textContent = v.bultos || 0;
            ajustarTexto(elBultos);
        }

        // --- Bloqueo del carrusel (depende de si hay orden) ---
        hayOrdenActual = hayOrden;
        actualizarBloqueo();
    }

    // marcarLed enciende/apaga un LED por su id agregando/quitando la clase .on
    function marcarLed(id, encendido) {
        const el = document.getElementById(id);
        if (el) el.classList.toggle('on', !!encendido);
    }

    // ============================================================
    //  SSE: el servidor empuja el estado como JSON en el evento "estado".
    // ============================================================
    const evtSource = new EventSource('/events');

    evtSource.addEventListener('estado', function (e) {
        try {
            aplicarEstado(JSON.parse(e.data));
        } catch (err) {
            console.error('[SSE] estado inválido:', err);
        }
    });

    // Personal en vivo (login/logout del emitter):
    // [{"nombre":"...","rol":"...","estado":"empty|pending|active"}, ...]
    evtSource.addEventListener('personal', function (e) {
        try {
            pintarPersonal(JSON.parse(e.data) || []);
        } catch (err) {
            console.error('[SSE] personal inválido:', err);
        }
    });

    // ============================================================
    //  Reloj grande de la pantalla principal (ya no hay footer).
    // ============================================================
    const elRelojGrande = document.getElementById('principal-reloj');
    function tick() {
        elRelojGrande.textContent = new Date().toLocaleTimeString('es-MX', { hour12: false });
    }
    tick();
    setInterval(tick, 1000);

    // Arranca el carrusel en la pantalla principal (y pinta los puntos).
    mostrarSlide(0);

    evtSource.onopen = function () {
        console.log('%c[SSE] Conexión abierta', 'color: green; font-weight: bold');
    };
    // El evento 'nats' se ignora: ya no hay indicador de conexión que pintar.
    </script>
</body>
</html>
