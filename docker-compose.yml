# Dashboard de Envasadoras — solo el frontend (la pantalla de las bolas).
#
# Levantar:
#   docker compose up -d --build
#
# TODA la configuración (servidor, NATS, MQTT y las valvuladoras) vive en
# config.yaml, que se monta dentro del contenedor. Para cambiar de envasadora
# basta editar config.yaml y hacer docker compose up -d (sin --build, es la
# misma imagen). Ya NO se usa el .env.
#
# Si necesitas correr VARIAS envasadoras en la misma máquina (ej. pruebas),
# duplica el servicio con distinto puerto y su propio config:
#
#   dashboard-2:
#     <<: *dashboard
#     container_name: papid-envasadora-2
#     volumes:
#       - ./config.silo2.yaml:/app/config.yaml:ro
#     ports:
#       - "3002:3000"

services:
  dashboard:
    build:
      context: .
      dockerfile: Dockerfile
    image: dashboard-envasadoras:latest
    container_name: papid-envasadora
    restart: unless-stopped
    environment:
      TZ: America/Mexico_City
    volumes:
      # config.yaml del host -> /app/config.yaml dentro del contenedor (solo
      # lectura). El dashboard lo busca ahí por defecto.
      - ./config.yaml:/app/config.yaml:ro
    ports:
      - "3001:3000"
    extra_hosts:
      - "host.docker.internal:host-gateway"
